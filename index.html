<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Highlights</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --line: #2a323d;
    --text: #e6edf3; --muted: #8b98a7; --accent: #f5a524;
    --ct: #5aa9ff; --t: #f0b24a; --ok: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 18px; }
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 28px 16px;
          text-align: center; background: var(--panel); cursor: pointer; transition: .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--panel2); }
  .drop b { color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #status { margin: 14px 0; color: var(--muted); min-height: 22px; text-align: center; }
  #status.err { color: var(--bad); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 10px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
          padding: 4px 12px; color: var(--muted); font-size: 13px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
  .filters button { border-radius: 999px; padding: 5px 13px; font-size: 14px; }
  .filters button.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px; margin-bottom: 12px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { background: var(--accent); color: #000; font-weight: 700; border-radius: 6px;
           padding: 2px 9px; font-size: 13px; }
  .badge.clutch { background: #a371f7; color: #fff; }
  .badge.special { background: #2f81f7; color: #fff; }
  .player { font-weight: 600; }
  .side { font-size: 12px; border-radius: 4px; padding: 1px 6px; border: 1px solid; }
  .side.CT { color: var(--ct); border-color: var(--ct); }
  .side.T { color: var(--t); border-color: var(--t); }
  .grow { flex: 1; }
  .small { color: var(--muted); font-size: 13px; }
  .won { color: var(--ok); } .lost { color: var(--bad); }
  ul.kills { list-style: none; padding: 0; margin: 10px 0; }
  ul.kills li { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line);
                font-size: 14px; flex-wrap: wrap; }
  ul.kills li:first-child { border-top: 0; }
  .hs { color: var(--accent); font-weight: 700; font-size: 12px; align-self: center; }
  .tag { font-size: 12px; color: #fff; background: #30363d; border-radius: 4px; padding: 1px 6px; align-self: center; }
  .cmd { display: flex; gap: 8px; margin-top: 8px; }
  .cmd input { flex: 1; min-width: 0; background: #0b0f14; color: var(--text); border: 1px solid var(--line);
               border-radius: 8px; padding: 7px 10px; font: 13px ui-monospace, Menlo, monospace; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  h2 { font-size: 17px; margin: 26px 0 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CS2 Highlights</h1>
  <div class="sub">Загрузи демку матча (.dem, .dem.zst, .dem.bz2 или .zip) — найдём ACE, мульти-киллы, клатчи и красивые убийства.</div>

  <div class="drop" id="drop">
    <div><b>Перетащи демку сюда</b> или нажми, чтобы выбрать файл</div>
    <div class="small">.dem · .dem.zst · .dem.bz2 · .zip — до 1 ГБ</div>
    <input type="file" id="file" accept=".dem,.zst,.bz2,.zip" class="hidden">
  </div>
  <div class="row"><button id="sample">Попробовать на примере</button></div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div id="status"></div>

  <div id="result" class="hidden">
    <div class="meta" id="meta"></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
    <h2>Игроки</h2>
    <table id="players"></table>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const TICKRATE = 64;
const FILTERS = [["all","Все"],["ace","ACE"],["4k","4K"],["3k","3K"],["clutch","Клатчи"],["special","Особые"]];
const TAG_LABELS = {noscope:"ноускоп", smoke:"смок", wallbang:"стена", blind:"вслепую"};
let data = null, filter = "all";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // textContent: имена игроков не интерпретируются как HTML
  return e;
}
function fmtTime(tick) {
  const s = Math.floor(tick / TICKRATE);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function setStatus(msg, err) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }

// ---------- загрузка
const drop = $("#drop"), fileInput = $("#file");
drop.onclick = () => fileInput.click();
fileInput.onchange = () => fileInput.files[0] && upload(fileInput.files[0]);
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
$("#sample").onclick = () => {
  setStatus("Загружаем пример…");
  fetch("/api/sample").then(r => r.json()).then(show).catch(e => setStatus("Ошибка: " + e, true));
};

function upload(file) {
  if (!/\.(dem|zst|bz2|zip)$/i.test(file.name)) return setStatus("Нужен файл .dem, .dem.zst, .dem.bz2 или .zip", true);
  const fd = new FormData(); fd.append("demo", file);
  const xhr = new XMLHttpRequest();
  const bar = $("#bar"), fill = $("#barfill");
  bar.style.display = "block"; fill.style.width = "0";
  setStatus("Загрузка…");
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    fill.style.width = (100 * e.loaded / e.total) + "%";
    setStatus("Загрузка: " + Math.round(100 * e.loaded / e.total) + "%");
  };
  xhr.upload.onload = () => setStatus("Распаковываем и анализируем демку…");
  xhr.onload = () => {
    bar.style.display = "none";
    let j = {}; try { j = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status === 200) show(j); else setStatus(j.error || ("Ошибка сервера " + xhr.status), true);
  };
  xhr.onerror = () => { bar.style.display = "none"; setStatus("Сеть недоступна", true); };
  xhr.open("POST", "/api/analyze"); xhr.send(fd);
}

// ---------- вывод
function show(d) {
  if (d.error) return setStatus(d.error, true);
  data = d; filter = "all";
  setStatus(d.highlights.length ? "" : "Хайлайтов не найдено");
  $("#result").classList.remove("hidden");

  const meta = $("#meta"); meta.replaceChildren();
  [["Карта: " + (d.meta?.map || "—")], ["Раундов: " + d.rounds], ["Хайлайтов: " + d.highlights.length]]
    .forEach(([t]) => meta.append(el("span", "chip", t)));

  const f = $("#filters"); f.replaceChildren();
  FILTERS.forEach(([key, label]) => {
    const n = key === "all" ? d.highlights.length : d.highlights.filter(h => h.type === key).length;
    if (key !== "all" && !n) return;
    const b = el("button", key === filter ? "on" : "", `${label} · ${n}`);
    b.onclick = () => { filter = key; show2(); };
    b.dataset.key = key; f.append(b);
  });
  renderPlayers(d.players);
  show2();
}
function show2() {
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b.dataset.key === filter));
  const list = $("#list"); list.replaceChildren();
  data.highlights.filter(h => filter === "all" || h.type === filter).forEach(h => list.append(card(h)));
}

function card(h) {
  const c = el("div", "card");
  const head = el("div", "head");
  head.append(el("span", "badge " + (h.type === "clutch" ? "clutch" : h.type === "special" ? "special" : ""), h.label));
  head.append(el("span", "player", h.player));
  head.append(el("span", "side " + h.side, h.side));
  head.append(el("span", "grow"));
  const info = el("span", "small", `Раунд ${h.round} · ${fmtTime(h.start_tick)}`);
  head.append(info);
  c.append(head);
  if (h.type === "clutch") {
    c.append(el("div", "small " + (h.won ? "won" : "lost"), h.won ? "Раунд выигран" : "Раунд проигран"));
  }
  const ul = el("ul", "kills");
  h.kills.forEach(k => {
    const li = el("li");
    li.append(el("span", "", "→ " + k.victim));
    li.append(el("span", "small", k.weapon));
    if (k.headshot) li.append(el("span", "hs", "HS"));
    k.tags.forEach(t => li.append(el("span", "tag", TAG_LABELS[t] || t)));
    if (k.distance) li.append(el("span", "small", k.distance + " м"));
    ul.append(li);
  });
  c.append(ul);
  const cmd = el("div", "cmd");
  const inp = el("input"); inp.readOnly = true; inp.value = h.command;
  const btn = el("button", "", "Копировать");
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(h.command); }
    catch (_) { inp.select(); document.execCommand("copy"); }
    btn.textContent = "Скопировано ✓"; setTimeout(() => btn.textContent = "Копировать", 1500);
  };
  cmd.append(inp, btn); c.append(cmd);
  return c;
}

function renderPlayers(players) {
  const t = $("#players"); t.replaceChildren();
  const hr = el("tr"); ["Игрок","K","D","HS%"].forEach(x => hr.append(el("th", "", x))); t.append(hr);
  players.forEach(p => {
    const r = el("tr");
    [p.name, p.kills, p.deaths, p.hs_pct + "%"].forEach(x => r.append(el("td", "", String(x))));
    t.append(r);
  });
}
</script>
</body>
</html>
